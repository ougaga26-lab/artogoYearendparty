<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f9c9b5">
<title>藝途發財夢｜手機控制器</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { min-height: 100svh; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  header .logo { font-size: 26px; -webkit-text-stroke-width: 5px; text-shadow: 0 4px 0 var(--ink); }
  header .st { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--ink); border-radius: 99px; padding: 3px 10px; }
  .card { padding: 18px; margin-bottom: 14px; }
  h2 { margin: 0 0 12px; font-size: 22px; font-weight: 900; }
  label.f { display: block; font-weight: 900; margin: 14px 0 8px; }
  input.name { width: 100%; font: inherit; font-size: 22px; font-weight: 900; border: 3px solid var(--ink); border-radius: 12px; padding: 10px 14px; background: #fff; }
  .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .roles button { border: 3px solid var(--ink); border-radius: 12px; background: #fff; padding: 10px 4px; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
  .roles button small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .roles button.on { background: var(--yellow); }
  .avs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .avs button { aspect-ratio: 1; font-size: 30px; border: 3px solid var(--ink); border-radius: 50%; background: #fff; padding: 0; }
  .avs button.on { background: var(--yellow); transform: scale(1.08); box-shadow: 0 3px 0 var(--ink); }
  .avs button.taken { opacity: .3; }
  .wide { width: 100%; font-size: 22px; padding: 14px; margin-top: 18px; }

  .me { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; }
  .me .avatar { width: 64px; height: 64px; font-size: 38px; }
  .me .nm { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .me .sub { font-size: 13px; font-weight: 700; color: var(--muted); }
  .me .coins { text-align: right; }
  .me .coins b { display: block; font-size: 34px; font-weight: 900; line-height: 1; }
  .me .coins span { font-size: 12px; font-weight: 700; }
  .items { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .item { border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 4px 10px; font-weight: 900; font-size: 14px; }
  .items .none { font-size: 13px; color: var(--muted); font-weight: 700; }

  .action { text-align: center; min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .action .big { font-size: 26px; font-weight: 900; line-height: 1.3; }
  .action .small { font-size: 15px; font-weight: 700; color: var(--muted); }
  .dicebtn {
    width: 220px; height: 220px; border-radius: 36px; border: 4px solid var(--ink); background: var(--red); color: #fff;
    box-shadow: 0 10px 0 var(--ink); font-size: 34px; font-weight: 900; display: grid; place-items: center; animation: bob 1.2s ease-in-out infinite;
  }
  .dicebtn:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); animation: none; }
  .dicebtn .ic { font-size: 80px; line-height: 1; display: block; }
  .toggle { display: flex; align-items: center; gap: 8px; font-weight: 900; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 14px; }
  .toggle input { width: 22px; height: 22px; }
  .opts { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .opts .btn { width: 100%; font-size: 20px; padding: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .opts .btn small { font-size: 14px; font-weight: 700; }
  .cardmini { width: 100%; border: 3px solid var(--ink); border-radius: 14px; padding: 12px; background: #fff; }
  .cardmini .t { font-weight: 900; font-size: 20px; }
  .cardmini .x { font-weight: 700; font-size: 15px; margin-top: 4px; }
  .cardmini .live { margin-top: 8px; font-weight: 900; border-top: 2px dashed var(--ink); padding-top: 8px; }
  .turnwho { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .turnwho .avatar { width: 48px; height: 48px; font-size: 28px; }
  .cheer {
    width: 170px; height: 170px; border-radius: 50%; border: 4px solid var(--ink); background: var(--yellow); box-shadow: 0 8px 0 var(--ink);
    font-size: 24px; font-weight: 900; display: grid; place-items: center; line-height: 1.2;
  }
  .cheer .ic { font-size: 56px; display: block; }
  .cheer:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 var(--ink); }
  .cheercount { font-weight: 900; font-size: 15px; }

  .mini { display: flex; flex-direction: column; gap: 6px; }
  .mini .r { display: grid; grid-template-columns: 26px 34px 1fr auto; gap: 8px; align-items: center; font-weight: 900; padding: 4px 6px; border-radius: 10px; }
  .mini .r.me2 { background: var(--yellow); }
  .mini .avatar { width: 32px; height: 32px; font-size: 18px; }

  .mcgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mcgrid .btn { width: 100%; font-size: 17px; }
  .adj { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 6px; align-items: center; font-weight: 900; padding: 6px 0; border-bottom: 2px dashed rgba(31,42,58,.2); }
  .adj .btn { padding: 4px 8px; font-size: 13px; }
  .center { text-align: center; }
  .rank { font-size: 64px; font-weight: 900; line-height: 1; }
  .hidden { display: none !important; }
  .shake { animation: shake .4s ease 2; }
</style>
</head>
<body>
<header>
  <div class="title-3d logo">藝途發財夢</div>
  <div class="st"><span class="dot" id="dot"></span><span id="stTxt">連線中</span></div>
</header>
<main id="app"><div class="card center"><h2>連線中…</h2><p style="font-weight:700">正在找主畫面，請稍等</p></div></main>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="assets/game-data.js"></script>
<script src="assets/net.js"></script>
<script>
const G = window.GAME;
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const ROOM = (qs.get('r') || '').toUpperCase();
const BROKER = +(qs.get('b') || 0);
const MC = qs.get('mc');
const app = $('app');

function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let PID = ls('wy26_pid_' + ROOM);
if (!PID) { PID = 'p' + Math.random().toString(36).slice(2, 10); ls('wy26_pid_' + ROOM, PID); }
if (qs.get('t')) PID = 'test' + qs.get('t'); // 測試用：同一台電腦開多個分頁模擬多支手機
let profile = null; try { profile = JSON.parse(ls('wy26_prof_' + ROOM)); } catch (e) {}
let lastProfile = null; try { lastProfile = JSON.parse(ls('wy26_prof_last')); } catch (e) {}

let S = null, net = null, joinSent = false;
let form = { name: (lastProfile && lastProfile.name) || '', role: (lastProfile && lastProfile.role) || 'staff', avatar: (lastProfile && lastProfile.avatar) || null };
let useDouble = false, cheerTaps = 0, cheerTotal = 0, lastTurnKey = '', lastRenderKey = '';
let busyChoice = null;

if (!ROOM) {
  app.innerHTML = '<div class="card center"><h2>找不到房間</h2><p style="font-weight:700">請用手機相機掃主畫面上的 QR Code 進來喔！</p></div>';
} else {
  net = netConnect({
    room: ROOM, broker: BROKER, role: 'phone',
    onStatus(s) {
      const m = { online: ['on', '已連線'], reconnecting: ['warn', '重連中'], offline: ['off', '離線'], error: ['off', '錯誤'] }[s] || ['', ''];
      $('dot').className = 'dot ' + m[0]; $('stTxt').textContent = `房號 ${ROOM}・${m[1]}`;
      if (s === 'online') { send({ t: 'hello' }); if (profile) send(Object.assign({ t: 'join' }, profile)); }
    },
    onMsg(m) {
      if (m && m.t === 'state') {
        const prevPhase = S && S.phase;
        S = m.s;
        // 主畫面重開了新局，但我還沒登記 → 自動重新加入
        if (profile && !S.players[PID] && !joinSent) { joinSent = true; send(Object.assign({ t: 'join' }, profile)); setTimeout(() => joinSent = false, 3000); }
        render(prevPhase);
      }
    },
  });
  setInterval(() => send({ t: 'ping' }), 8000);
  setInterval(() => { if (cheerTaps) { send({ t: 'cheer', n: cheerTaps }); cheerTaps = 0; } }, 450);
}
function send(o) { if (net) net.send(Object.assign({ pid: PID }, o)); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const av = (p, cls = '') => `<span class="avatar ${cls}" style="--c:${p.color}">${p.avatar}</span>`;
const vib = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

// 螢幕常亮
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); send({ t: 'hello' }); } });
document.addEventListener('click', keepAwake, { once: true });

/* ================= 畫面 ================= */
function render(prevPhase) {
  if (!S) return;
  if (MC) return renderMC();
  const me = S.players[PID];
  if (editingNow) return;
  if (!me) {
    // 正在打字時不要重畫，避免鍵盤被收起
    if (document.activeElement && document.activeElement.id === 'nm') return;
    return renderJoin();
  }
  const isCur = curPid() === PID;
  // 輪到我 → 震動提示
  const tk = S.round + ':' + S.turn + ':' + S.phase;
  if (isCur && S.phase === 'roll' && lastTurnKey !== tk) { vib([200, 100, 200]); }
  lastTurnKey = tk;

  let h = meCard(me);
  h += `<div class="card action" id="act">${actionHTML(me, isCur)}</div>`;
  h += miniBoard(me);
  app.innerHTML = h;
  bindAction(me);
}
const curPid = () => S.order.length ? S.order[S.turn % S.order.length] : null;
const ranked = () => S.order.map((id) => S.players[id]).filter(Boolean).sort((a, b) => b.coins - a.coins);

function meCard(me) {
  if (me.role === 'cheer') {
    return `<div class="card me">${av(me)}<div><div class="nm">${esc(me.name)}</div><div class="sub">啦啦隊・幫場上的人狂按加油</div></div><div></div></div>`;
  }
  const rk = ranked().findIndex((p) => p.pid === PID) + 1;
  const tile = G.tiles[me.pos];
  return `<div class="card">
    <div class="me">${av(me)}
      <div><div class="nm">${esc(me.name)}${me.role === 'guest' ? ' <small style="font-size:13px">外賓</small>' : ''}</div>
      <div class="sub">第 ${rk} 名・在「${tile.icon} ${tile.name}」${me.skip ? `・暫停 ${me.skip} 回合` : ''}</div></div>
      <div class="coins"><b>${me.coins}</b><span>${G.currency}</span></div>
    </div>
    <div class="items">${me.items.length ? me.items.map((it) => `<span class="item">${G.items[it].icon} ${G.items[it].name}</span>`).join('') : '<span class="none">口袋空空，抽機會卡可以拿到道具</span>'}</div>
  </div>`;
}

function cardMini() {
  const c = S.card; if (!c) return '';
  return `<div class="cardmini"><div class="t">${c.icon} ${esc(c.title)}</div>${c.text ? `<div class="x">${esc(c.text)}</div>` : ''}${c.live ? `<div class="live">🎬 ${esc(c.live)}</div>` : ''}${c.status ? `<div class="live">${esc(c.status)}</div>` : ''}</div>`;
}

function actionHTML(me, isCur) {
  const cp = S.players[curPid()];
  if (S.phase === 'lobby') {
    return `<div class="big">已加入！🎉</div><div class="small">等主持人按下開始<br>目前 ${Object.keys(S.players).length} 人在場</div>
      <button class="btn paper sm" id="editBtn">修改名字／角色</button>`;
  }
  if (S.phase === 'ended') {
    if (me.role === 'cheer') return `<div class="big">遊戲結束！</div><div class="small">感謝你的加油 📣</div>`;
    const rk = S.final ? S.final.ranking.indexOf(PID) + 1 : 0;
    return `<div class="small">最終名次</div><div class="rank">${rk ? '#' + rk : '-'}</div><div class="big">${rk === 1 ? '👑 你是發財王！' : rk <= 3 ? '上台領獎吧！' : '明年再來發財！'}</div><div class="small">${me.coins} ${G.currency}</div>`;
  }
  const pd = S.pending;
  if (pd && pd.by === 'player' && pd.pid === PID) {
    return `${cardMini()}<div class="big">${esc(pd.title)}</div>
      <div class="opts">${pd.options.map((o) => `<button class="btn ${o.v === 'accept' ? 'paper' : o.v === 'live' ? 'red' : ''}" data-v="${o.v}"><span>${esc(o.label)}</span>${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}</div>`;
  }
  if (pd && pd.by === 'mc' && pd.pid === PID) {
    return `${cardMini()}<div class="big">🎬 表演時間！</div><div class="small">完成後由主持人判定</div>`;
  }
  if (isCur && S.phase === 'roll') {
    const hasDouble = me.items.includes('double');
    return `<div class="big">輪到你了！</div>
      <button class="dicebtn" id="rollBtn"><span><span class="ic">🎲</span>擲骰子</span></button>
      ${hasDouble ? `<label class="toggle"><input type="checkbox" id="dbl" ${useDouble ? 'checked' : ''}> 🎲 使用雙骰卡（擲兩顆）</label>` : ''}
      <div class="small">也可以搖一搖手機擲骰</div>`;
  }
  if (isCur) {
    return `${cardMini() || `<div class="big">${S.dice ? '🎲 ' + S.dice.vals.join(' + ') : ''}</div>`}<div class="small">${esc(S.msg || '請看大螢幕！')}</div>`;
  }
  // 別人的回合
  return `<div class="turnwho">${cp ? av(cp) : ''}<div class="big">${cp ? esc(cp.name) : ''} 的回合</div></div>
    ${cardMini() || `<div class="small">${esc(S.msg || '')}</div>`}
    <button class="cheer" id="cheerBtn"><span><span class="ic">📣</span>加油！</span></button>
    <div class="cheercount">狂按幫 ${cp ? esc(cp.name) : '他'} 加錢！每 10 下 +1 幣<br><span id="cc">${cheerTotal ? `你已經按了 ${cheerTotal} 下` : ''}</span></div>`;
}

function bindAction(me) {
  const roll = $('rollBtn');
  if (roll) roll.onclick = doRoll;
  const dbl = $('dbl');
  if (dbl) dbl.onchange = () => useDouble = dbl.checked;
  const ch = $('cheerBtn');
  if (ch) ch.addEventListener('pointerdown', () => { cheerTaps++; cheerTotal++; vib(15); const c = $('cc'); if (c) c.textContent = `你已經按了 ${cheerTotal} 下`; });
  const ed = $('editBtn');
  if (ed) ed.onclick = () => { form = { name: me.name, role: me.role, avatar: me.avatar }; renderJoin(true); };
  document.querySelectorAll('#act [data-v]').forEach((b) => b.onclick = () => {
    if (!S.pending) return;
    send({ t: 'choose', id: S.pending.id, v: b.dataset.v });
    document.querySelectorAll('#act [data-v]').forEach((x) => x.disabled = true);
    vib(30);
  });
}

let rolled = '';
function doRoll() {
  const k = S.round + ':' + S.turn + ':' + S.seq;
  if (rolled === k) return;
  rolled = k;
  send({ t: 'roll', double: useDouble && S.players[PID].items.includes('double') });
  useDouble = false; vib(60);
  const b = $('rollBtn'); if (b) { b.disabled = true; b.classList.add('shake'); }
}
// 搖一搖
let lastShake = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a) return;
  const f = Math.abs(a.x) + Math.abs(a.y) + Math.abs(a.z);
  if (f > 38 && Date.now() - lastShake > 1500 && S && S.phase === 'roll' && curPid() === PID) { lastShake = Date.now(); doRoll(); }
}
window.addEventListener('devicemotion', onMotion);
document.addEventListener('click', () => {
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {});
}, { once: true });

function miniBoard(me) {
  if (S.phase === 'lobby') return '';
  const list = ranked();
  const myIdx = list.findIndex((p) => p.pid === PID);
  const show = list.slice(0, 5);
  if (myIdx >= 5) show.push(list[myIdx]);
  return `<div class="card"><h2 style="font-size:18px">排行榜・第 ${S.round}/${S.maxRounds} 輪</h2><div class="mini">${show.map((p) => `
    <div class="r${p.pid === PID ? ' me2' : ''}"><span>${list.indexOf(p) + 1}</span>${av(p)}<span>${esc(p.name)}</span><span>${p.coins}</span></div>`).join('')}</div></div>`;
}

/* ---------- 加入表單 ---------- */
let editingNow = false;
function renderJoin(editing) {
  editingNow = !!editing;
  const taken = new Set(Object.values(S.players).filter((p) => p.pid !== PID).map((p) => p.avatar));
  if (!form.avatar || taken.has(form.avatar)) form.avatar = G.avatars.find((a) => !taken.has(a)) || G.avatars[0];
  const roles = [['staff', '同仁', '下場玩'], ['guest', '外賓', '下場玩'], ['cheer', '啦啦隊', '只加油']];
  const inProg = S.phase !== 'lobby';
  app.innerHTML = `<div class="card">
    <h2>${editing ? '修改資料' : '加入遊戲'}</h2>
    ${inProg && !editing ? '<p style="font-weight:700;margin:0 0 8px">遊戲進行中，加入後會從起點出發 🏃</p>' : ''}
    <label class="f">你的名字（最多 8 字）</label>
    <input class="name" id="nm" maxlength="8" value="${esc(form.name)}" placeholder="例如：小明" autocomplete="off">
    <label class="f">你是</label>
    <div class="roles">${roles.map(([v, t, s]) => `<button data-r="${v}" class="${form.role === v ? 'on' : ''}">${t}<small>${s}</small></button>`).join('')}</div>
    <label class="f">選一隻代表你的動物</label>
    <div class="avs">${G.avatars.map((a) => `<button data-a="${a}" class="${form.avatar === a ? 'on' : ''}${taken.has(a) ? ' taken' : ''}" ${taken.has(a) ? 'disabled' : ''}>${a}</button>`).join('')}</div>
    <button class="btn red wide" id="joinBtn">${editing ? '儲存' : '加入！'}</button>
  </div>`;
  $('nm').oninput = (e) => form.name = e.target.value;
  document.querySelectorAll('[data-r]').forEach((b) => b.onclick = () => { form.role = b.dataset.r; renderJoin(editing); });
  document.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { form.avatar = b.dataset.a; renderJoin(editing); });
  $('joinBtn').onclick = () => {
    form.name = $('nm').value.trim();
    if (!form.name) { $('nm').focus(); $('nm').classList.add('shake'); return; }
    profile = { name: form.name, role: form.role, avatar: form.avatar };
    ls('wy26_prof_' + ROOM, JSON.stringify(profile)); ls('wy26_prof_last', JSON.stringify(profile));
    send(Object.assign({ t: 'join' }, profile));
    $('joinBtn').disabled = true; $('joinBtn').textContent = '加入中…';
    keepAwake();
    if (editing) setTimeout(() => { editingNow = false; render(); }, 600);
  };
}

/* ---------- 主持人模式 ---------- */
function mc(cmd, extra) { send(Object.assign({ t: 'mc', key: MC, cmd }, extra || {})); vib(30); }
function renderMC() {
  const cp = S.players[curPid()];
  const pd = S.pending;
  let h = `<div class="card"><h2>🎙️ 主持人控制台</h2>
    <div style="font-weight:900">階段：${{ lobby: '大廳等待中', roll: '等待擲骰', rolling: '擲骰中', moving: '移動中', card: '事件中', result: '結果', skip: '暫停', ended: '已結束', turn: '換人' }[S.phase] || S.phase}${cp && S.phase !== 'lobby' ? `・輪到 ${cp.avatar} ${esc(cp.name)}` : ''}</div>
    <div style="font-weight:700;color:var(--muted);font-size:14px">第 ${S.round}/${S.maxRounds} 輪・${S.order.length} 位玩家</div></div>`;
  if (S.card) h += `<div class="card">${cardMini()}</div>`;
  if (pd) {
    const who = S.players[pd.pid];
    h += `<div class="card"><h2>${pd.by === 'mc' ? '請判定' : `代 ${who ? esc(who.name) : ''} 選擇`}：${esc(pd.title)}</h2>
      <div class="opts" style="display:flex;flex-direction:column;gap:10px">${pd.options.map((o, i) => `<button class="btn ${pd.by === 'mc' ? (i ? 'paper' : 'green') : 'paper'}" style="font-size:22px;padding:14px" data-mv="${o.v}">${esc(o.label)}</button>`).join('')}</div></div>`;
  }
  h += `<div class="card"><div class="mcgrid">
      ${S.phase === 'lobby' ? '<button class="btn red" data-c="start">開始遊戲</button>' : ''}
      <button class="btn" data-c="roll" ${S.phase !== 'roll' ? 'disabled' : ''}>代擲骰子</button>
      <button class="btn paper" data-c="next" ${S.phase === 'lobby' || S.phase === 'ended' ? 'disabled' : ''}>跳到下一位</button>
      <button class="btn red" data-c="end" ${S.phase === 'lobby' || S.phase === 'ended' ? 'disabled' : ''}>結束遊戲</button>
    </div></div>`;
  h += `<div class="card"><h2 style="font-size:18px">手動加扣錢</h2>${ranked().map((p) => `
    <div class="adj"><span>${p.avatar} ${esc(p.name)}・${p.coins}</span>
      <button class="btn sm red" data-adj="${p.pid}" data-n="-50">-50</button><button class="btn sm paper" data-adj="${p.pid}" data-n="-10">-10</button>
      <button class="btn sm paper" data-adj="${p.pid}" data-n="10">+10</button><button class="btn sm" data-adj="${p.pid}" data-n="50">+50</button></div>`).join('')}</div>`;
  app.innerHTML = h;
  document.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => { mc('choose', { id: pd.id, v: b.dataset.mv }); b.disabled = true; });
  document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => {
    if (b.dataset.c === 'end' && !confirm('確定結束遊戲進入結算？')) return;
    mc(b.dataset.c);
  });
  document.querySelectorAll('[data-adj]').forEach((b) => b.onclick = () => mc('adj', { pid: b.dataset.adj, n: +b.dataset.n }));
}
</script>
</body>
</html>
